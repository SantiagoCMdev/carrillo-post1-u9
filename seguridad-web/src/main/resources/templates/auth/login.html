<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
</head>
<body>
  <h1>Iniciar Sesión</h1>
  <!-- Spring Security procesa el POST a /login automáticamente -->
  <form th:action="@{/login}" method="post">
    <div th:if="${param.error}" style="color:red">
      Correo o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}">Sesión cerrada correctamente.</div>
    <div th:if="${param.registrado}">Registro exitoso. Inicie sesión.</div>
    <div>
      <label>Correo: <input type="email" name="username" required /></label>
    </div>
    <div>
      <label>Contraseña: <input type="password" name="password" required /></label>
    </div>
    <!-- Thymeleaf + Spring Security incluye el token CSRF automáticamente -->
    <button type="submit">Ingresar</button>
  </form>
  <br/>
  <a th:href="@{/registro}">¿No tiene cuenta? Registrarse</a>
</body>
</html>
